<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Location Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- App CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <!-- Fallback styles while loading -->
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        #map-container { width: 100%; height: 100vh; background: #f5f5f5; }
        .loading-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #2c3e50; 
            color: white; 
            z-index: 9999; 
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div style="text-align: center;">
            <h2>Loading Australian Location Tracker</h2>
            <p>Please wait while we load the map and your location...</p>
            <div style="margin-top: 20px; width: 100px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden;">
                <div id="loading-bar" style="width: 0%; height: 100%; background: #3498db; transition: width 0.5s;"></div>
            </div>
        </div>
    </div>
    
    <div id="map-container"></div>
    
    <div id="speed-info">
        <div class="speed-value" id="current-speed">0 km/h</div>
        <div class="speed-limit" id="speed-limit">Limit: -- km/h</div>
    </div>
    
    <div id="poi-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="poi-loader" style="text-align: center; padding: 20px;">Loading details...</div>
            <div id="poi-content" style="display: none;">
                <img id="poi-image" src="" alt="POI Image">
                <h3 id="poi-title"></h3>
                <p id="poi-description"></p>
                <a id="poi-link" target="_blank">Learn more</a>
            </div>
        </div>
    </div>
    
    <div id="services-bar">
        <div class="service-icon" id="petrol-station">
            <i class="fas fa-gas-pump"></i>
            <span class="distance"></span>
        </div>
        <div class="service-icon" id="hospital">
            <i class="fas fa-hospital"></i>
            <span class="distance"></span>
        </div>
        <div class="service-icon" id="cafe">
            <i class="fas fa-coffee"></i>
            <span class="distance"></span>
        </div>
        <div class="service-icon" id="toilet">
            <i class="fas fa-restroom"></i>
            <span class="distance"></span>
        </div>
    </div>
    
    <div id="audio-controls">
        <button id="audio-toggle">▶ Play Radio</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- App JS -->
    <script src="app.js" defer></script>

    <!-- Simplified loading screen logic -->
    <script>
        window.addEventListener('load', () => {
             // Hide loading screen after a brief delay
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            }, 300);
        });
    </script>
</body>
</html>
